<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排序算法的音乐可视化</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
            background-attachment: fixed;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding-top: 20px;
        }
        .top-links {
            position: fixed;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 20px;
            z-index: 100;
            background: rgba(0,0,0,0.3);
            padding: 10px 18px;
            border-radius: 25px;
            backdrop-filter: blur(10px);
        }
        .top-links a {
            color: #ccc;
            text-decoration: none;
            font-size: 0.9em;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .top-links a:hover {
            color: #00d4ff;
            transform: scale(1.05);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #ff6b6b);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            animation: glow 3s ease-in-out infinite alternate;
        }
        @keyframes glow {
            from { filter: drop-shadow(0 0 5px rgba(0, 212, 255, 0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(123, 44, 191, 0.5)); }
        }
        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            align-items: start;
        }
        .sidebar {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 20px;
        }
        .sidebar-title {
            font-size: 1.1em;
            color: #00d4ff;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .control-group {
            margin-bottom: 20px;
        }
        .control-group label {
            font-size: 0.85em;
            color: #888;
            display: block;
            margin-bottom: 8px;
        }
        input[type="file"] {
            display: none;
        }
        .file-btn, .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .file-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .file-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        .btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            font-weight: 500;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(56, 239, 125, 0.4);
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }
        .btn-stop {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn-group .btn {
            flex: 1;
            padding: 12px 10px;
        }
        select {
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            font-size: 0.95em;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        select:hover {
            border-color: rgba(0, 212, 255, 0.5);
        }
        select:focus {
            outline: none;
            border-color: #00d4ff;
        }
        select option {
            background: #1a1a2e;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .speed-control input[type="range"] {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: rgba(255,255,255,0.1);
            -webkit-appearance: none;
            cursor: pointer;
        }
        .speed-control input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00d4ff, #7b2cbf);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(0, 212, 255, 0.5);
        }
        .speed-value {
            background: rgba(0, 212, 255, 0.2);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            color: #00d4ff;
            min-width: 60px;
            text-align: center;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .canvas-container {
            position: relative;
            background: rgba(0,0,0,0.4);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            border: 1px solid rgba(255,255,255,0.08);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        #imageCanvas {
            max-width: 100%;
            display: block;
            border-radius: 10px;
        }
        .info-panel {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 15px;
        }
        .info-item {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.06);
            transition: all 0.3s;
        }
        .info-item:hover {
            background: rgba(255,255,255,0.06);
            transform: translateY(-3px);
        }
        .info-item .value {
            font-size: 1.45em;
            font-weight: bold;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .info-item .label {
            font-size: 0.8em;
            color: #666;
            margin-top: 5px;
        }
        .slice-numbers {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 3px;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        .slice-numbers::-webkit-scrollbar {
            width: 6px;
        }
        .slice-numbers::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        .slice-num {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.65em;
            background: rgba(255,255,255,0.08);
            border-radius: 4px;
            transition: all 0.15s;
            font-weight: 500;
        }
        .slice-num.active {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #000;
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
        }
        .slice-num.comparing {
            background: linear-gradient(135deg, #f45c43, #eb3349);
            color: #fff;
            transform: scale(1.2);
        }
        .slice-num.sorted {
            background: linear-gradient(135deg, #38ef7d, #11998e);
            color: #000;
        }
        .progress-section {
            background: rgba(255,255,255,0.03);
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .progress-label {
            font-size: 0.8em;
            color: #666;
            margin-bottom: 8px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #7b2cbf, #ff6b6b);
            width: 0%;
            transition: width 0.3s;
            border-radius: 4px;
        }
        .placeholder {
            color: #555;
            text-align: center;
            padding: 60px;
        }
        .placeholder span {
            font-size: 4em;
            display: block;
            margin-bottom: 15px;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }
        .placeholder p {
            font-size: 1.1em;
        }
        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
            .info-panel {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
                padding-top: 60px;
            }
            .container {
                padding-top: 10px;
            }
            .top-links {
                top: 10px;
                left: 10px;
                right: 10px;
                justify-content: center;
                padding: 8px 15px;
                gap: 15px;
            }
            .top-links a {
                font-size: 0.8em;
            }
            h1 {
                font-size: 1.5em;
                margin-bottom: 15px;
            }
            .sidebar {
                padding: 15px;
                border-radius: 15px;
            }
            .sidebar-title {
                font-size: 1em;
                margin-bottom: 15px;
            }
            .control-group {
                margin-bottom: 15px;
            }
            .control-group label {
                font-size: 0.8em;
                margin-bottom: 6px;
            }
            .file-btn, .btn {
                padding: 10px 15px;
                font-size: 0.85em;
            }
            .btn-group {
                gap: 8px;
            }
            .btn-group .btn {
                padding: 10px 8px;
            }
            select {
                padding: 10px 12px;
                font-size: 0.85em;
            }
            .speed-control {
                gap: 8px;
            }
            .speed-value {
                padding: 4px 10px;
                font-size: 0.75em;
                min-width: 50px;
            }
            .canvas-container {
                min-height: 200px;
                border-radius: 15px;
            }
            .info-panel {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .info-item {
                padding: 12px;
                border-radius: 10px;
            }
            .info-item .value {
                font-size: 1.2em;
            }
            .info-item .label {
                font-size: 0.7em;
            }
            .progress-section {
                padding: 12px 15px;
                border-radius: 10px;
            }
            .progress-label {
                font-size: 0.75em;
            }
            .slice-numbers {
                padding: 10px;
                max-height: 100px;
                gap: 2px;
                border-radius: 10px;
            }
            .slice-num {
                width: 18px;
                height: 18px;
                font-size: 0.55em;
            }
            .placeholder {
                padding: 30px;
            }
            .placeholder span {
                font-size: 2.5em;
            }
            .placeholder p {
                font-size: 0.9em;
            }
        }
        @media (max-width: 400px) {
            h1 {
                font-size: 1.2em;
            }
            .info-panel {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .info-item {
                padding: 10px;
            }
            .info-item .value {
                font-size: 1em;
            }
            .slice-num {
                width: 16px;
                height: 16px;
                font-size: 0.5em;
            }
        }
    </style>
</head>
<body>
    <div class="top-links">
        <a href="https://github.com/DZYCD" target="_blank">GitHub</a>
        <a href="http://47.100.11.98" target="_blank">个人主页</a>
    </div>
    <div class="container">
        
        <div class="main-layout">
            <div class="sidebar">
                
                <div class="control-group">
                    <label>预设图片</label>
                    <select id="presetImageSelect">
                        <option value="">-- 选择预设 --</option>
                        <option value="image/Still_040_001.webp">Still_040_001</option>
                        <option value="image/Still_350_001.webp">Still_350_001</option>
                        <option value="image/Still_400_002_1.webp">Still_400_002_1</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>上传图片</label>
                    <label class="file-btn" for="imageInput">上传图片</label>
                    <input type="file" id="imageInput" accept="image/*">
                </div>
                
                <div class="control-group">
                    <label>预设音频</label>
                    <select id="presetAudioSelect">
                        <option value="">-- 选择预设 --</option>
                        <option value="music/0103Adv15_Hanna007.mp3">0103Adv15_Hanna007</option>
                        <option value="music/0204Adv12_Hiro032.mp3">0204Adv12_Hiro032</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>上传音频</label>
                    <label class="file-btn" for="audioInput">上传音频</label>
                    <input type="file" id="audioInput" accept="audio/*">
                </div>
                
                <div class="control-group">
                    <label>选择排序算法</label>
                    <select id="algorithmSelect">
                        <option value="selection">选择排序</option>
                        <option value="insertion">插入排序</option>
                        <option value="quick">快速排序</option>
                        <option value="merge">归并排序</option>
                        <option value="heap">堆排序</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label>⏱️ 延迟时间</label>
                    <div class="speed-control">
                        <input type="range" id="delaySlider" min="50" max="500" value="200">
                        <span class="speed-value" id="delayValue">200ms</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label>🧩 切片数量</label>
                    <div class="speed-control">
                        <input type="range" id="sliceSlider" min="10" max="200" value="50">
                        <span class="speed-value" id="sliceValue">50</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <div class="btn-group">
                        <button class="btn" id="shuffleBtn" disabled>🔀 打乱</button>
                        <button class="btn btn-stop" id="stopBtn" disabled>⏹️</button>
                    </div>
                </div>
                
                <div class="control-group">
                    <button class="btn" id="startBtn" disabled style="font-size: 1.1em; padding: 15px;">▶️ 开始排序</button>
                </div>
            </div>
            
            <div class="main-content">
                <div class="canvas-container">
                    <canvas id="imageCanvas"></canvas>
                    <div class="placeholder" id="placeholder">
                        <span>⏳</span>
                        <p>正在加载默认资源...</p>
                    </div>
                </div>
                
                <div class="info-panel">
                    <div class="info-item">
                        <div class="value" id="comparisons">0</div>
                        <div class="label">比较次数</div>
                    </div>
                    <div class="info-item">
                        <div class="value" id="swaps">0</div>
                        <div class="label">交换次数</div>
                    </div>
                    <div class="info-item">
                        <div class="value" id="writes">0</div>
                        <div class="label">写入次数</div>
                    </div>
                    <div class="info-item">
                        <div class="value" id="elapsed">0.0s</div>
                        <div class="label">已用时</div>
                    </div>
                    <div class="info-item">
                        <div class="value" id="currentAlgo">-</div>
                        <div class="label">当前算法</div>
                    </div>
                    <div class="info-item">
                        <div class="value" id="status">等待中</div>
                        <div class="label">状态</div>
                    </div>
                </div>
                
                <div class="progress-section">
                    <div class="progress-label">排序进度</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>
                
                <div class="slice-numbers" id="sliceNumbers"></div>
            </div>
        </div>
    </div>

    <script>
        // ================= 全局状态 =================
        let originalImage = null;
        let audioContext = null;
        let masterGain = null;
        let audioBuffer = null;
        let slices = [];
        let sliceOrder = [];
        // 渲染覆盖层：归并在「已确定前缀」的生长过程中用，算法状态 sliceOrder 不动
        let displayOrder = null;
        let isRunning = false;
        let isStopped = false;
        let delay = 200;
        let comparisons = 0;
        let swaps = 0;
        let writes = 0;
        let sliceCount = 50;
        let activeSources = new Set();
        let totalSteps = 0;
        let doneSteps = 0;
        let runStartedAt = 0;
        let elapsedTimer = null;

        // ================= DOM =================
        const canvas = document.getElementById('imageCanvas');
        const ctx = canvas.getContext('2d');
        const imageInput = document.getElementById('imageInput');
        const audioInput = document.getElementById('audioInput');
        const presetImageSelect = document.getElementById('presetImageSelect');
        const presetAudioSelect = document.getElementById('presetAudioSelect');
        const algorithmSelect = document.getElementById('algorithmSelect');
        const delaySlider = document.getElementById('delaySlider');
        const delayValue = document.getElementById('delayValue');
        const sliceSlider = document.getElementById('sliceSlider');
        const sliceValueSpan = document.getElementById('sliceValue');
        const shuffleBtn = document.getElementById('shuffleBtn');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const placeholder = document.getElementById('placeholder');
        const sliceNumbersDiv = document.getElementById('sliceNumbers');
        const comparisonsEl = document.getElementById('comparisons');
        const swapsEl = document.getElementById('swaps');
        const writesEl = document.getElementById('writes');
        const elapsedEl = document.getElementById('elapsed');
        const statusEl = document.getElementById('status');
        const currentAlgoEl = document.getElementById('currentAlgo');
        const progressFill = document.getElementById('progressFill');

        // ================= 事件监听 =================
        imageInput.addEventListener('change', handleImageUpload);
        audioInput.addEventListener('change', handleAudioUpload);
        presetImageSelect.addEventListener('change', handlePresetImage);
        presetAudioSelect.addEventListener('change', handlePresetAudio);
        delaySlider.addEventListener('input', () => {
            delay = parseInt(delaySlider.value, 10);
            delayValue.textContent = delay + 'ms';
        });
        sliceSlider.addEventListener('input', () => {
            if (isRunning) return;
            sliceCount = parseInt(sliceSlider.value, 10);
            sliceValueSpan.textContent = sliceCount;
            if (originalImage) {
                initializeSlices();
                resetRunState();
            }
        });
        shuffleBtn.addEventListener('click', shuffleSlices);
        startBtn.addEventListener('click', startSorting);
        stopBtn.addEventListener('click', stopSorting);

        // ================= 音频 =================
        function ensureAudioGraph() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioContext.createGain();
                masterGain.gain.value = 0.9;
                masterGain.connect(audioContext.destination);
            }
            return audioContext;
        }

        function stopAllAudio() {
            for (const source of activeSources) {
                try { source.stop(); } catch (e) { /* 已停止 */ }
            }
            activeSources.clear();
        }

        // 播放第 value 片（原始横向位置）对应的音频片段
        // 加 8ms 淡入/淡出包络，避免直接截断 PCM 造成的爆音
        function playAudioSlice(value) {
            if (!audioBuffer || !audioContext) return;
            if (!Number.isFinite(value) || value < 0) return;

            const clipDuration = Math.max(delay / 1000, 0.03);
            const offset = (value / sliceCount) * audioBuffer.duration;
            if (offset >= audioBuffer.duration) return;

            const playable = Math.min(clipDuration, audioBuffer.duration - offset);
            const t0 = audioContext.currentTime;
            const fade = Math.min(0.008, playable / 4);

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;

            const gain = audioContext.createGain();
            gain.gain.setValueAtTime(0, t0);
            gain.gain.linearRampToValueAtTime(1, t0 + fade);
            gain.gain.setValueAtTime(1, t0 + Math.max(fade, playable - fade));
            gain.gain.linearRampToValueAtTime(0, t0 + playable);

            source.connect(gain);
            gain.connect(masterGain);

            source.onended = () => {
                activeSources.delete(source);
                try { source.disconnect(); gain.disconnect(); } catch (e) { /* 忽略 */ }
            };

            activeSources.add(source);
            source.start(t0, offset, playable);
        }

        function playFullAudio() {
            if (!audioBuffer || !audioContext) return;
            stopAllAudio();

            const source = audioContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(masterGain);
            source.onended = () => activeSources.delete(source);

            activeSources.add(source);
            source.start(0);
        }

        // ================= 资源载入 =================
        function busyGuard() {
            // 运行中不接受新资源，避免切片索引与生成器状态脱节
            return isRunning;
        }

        function handlePresetImage() {
            if (busyGuard()) {
                presetImageSelect.value = '';
                return;
            }
            const src = presetImageSelect.value;
            if (!src) return;

            const img = new Image();
            img.onload = () => {
                originalImage = img;
                initializeSlices();
                resetRunState();
                checkReady();
            };
            img.onerror = () => {
                alert('图片加载失败');
            };
            img.src = src;
        }

        async function handlePresetAudio() {
            if (busyGuard()) {
                presetAudioSelect.value = '';
                return;
            }
            const src = presetAudioSelect.value;
            if (!src) return;

            try {
                const audioCtx = ensureAudioGraph();
                const response = await fetch(src);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const arrayBuffer = await response.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                resetRunState();
                checkReady();
            } catch (e) {
                console.error('音频加载失败:', e);
                alert('音频加载失败');
            }
        }

        function handleImageUpload(e) {
            if (busyGuard()) {
                e.target.value = '';
                return;
            }
            const file = e.target.files[0];
            if (!file) return;

            presetImageSelect.value = '';

            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    initializeSlices();
                    resetRunState();
                    checkReady();
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function handleAudioUpload(e) {
            if (busyGuard()) {
                e.target.value = '';
                return;
            }
            const file = e.target.files[0];
            if (!file) return;

            presetAudioSelect.value = '';

            try {
                const audioCtx = ensureAudioGraph();
                const arrayBuffer = await file.arrayBuffer();
                audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                resetRunState();
                checkReady();
            } catch (e) {
                console.error('音频解码失败:', e);
                alert('音频解码失败');
            }
        }

        function checkReady() {
            const ready = Boolean(originalImage && audioBuffer);
            shuffleBtn.disabled = !ready;
            if (ready) {
                placeholder.style.display = 'none';
                statusEl.textContent = '已就绪';
            }
        }

        // 换资源后把一次运行的统计/进度清干净
        function resetRunState() {
            stopAllAudio();
            totalSteps = 0;
            resetStats();
            startBtn.disabled = true;
            if (!isRunning) statusEl.textContent = originalImage && audioBuffer ? '已就绪（请先打乱）' : '请选择资源';
        }

        // ================= 切片 =================
        function initializeSlices() {
            if (!originalImage) return;

            const maxWidth = 1000;
            const scale = Math.min(1, maxWidth / originalImage.width);
            canvas.width = Math.round(originalImage.width * scale);
            canvas.height = Math.round(originalImage.height * scale);

            slices = [];
            sliceOrder = [];

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = originalImage.width;
            tempCanvas.height = originalImage.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(originalImage, 0, 0);

            const origSliceWidth = originalImage.width / sliceCount;

            for (let i = 0; i < sliceCount; i++) {
                const sx = Math.round(i * origSliceWidth);
                const ex = i === sliceCount - 1 ? originalImage.width : Math.round((i + 1) * origSliceWidth);
                const sw = Math.max(1, ex - sx);

                const sliceCanvas = document.createElement('canvas');
                sliceCanvas.width = sw;
                sliceCanvas.height = originalImage.height;
                const sliceCtx = sliceCanvas.getContext('2d');
                sliceCtx.drawImage(tempCanvas,
                    sx, 0, sw, originalImage.height,
                    0, 0, sw, originalImage.height
                );

                slices.push({
                    index: i,
                    canvas: sliceCanvas
                });
                sliceOrder.push(i);
            }

            displayOrder = null;
            renderSlices();
        }

        // sortedRange 为闭区间 [from, to]，标记已经落到最终位置的切片
        function renderSlices(activeIndices = [], comparingIndices = [], sortedRange = null) {
            if (slices.length === 0) return;

            const view = displayOrder || sliceOrder;
            const sliceWidth = canvas.width / view.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < view.length; i++) {
                const slice = slices[view[i]];
                if (!slice) continue;
                const x = i * sliceWidth;
                const w = (i === view.length - 1) ? (canvas.width - x) : sliceWidth;
                ctx.drawImage(slice.canvas,
                    0, 0, slice.canvas.width, slice.canvas.height,
                    x, 0, w, canvas.height
                );
            }

            updateSliceNumbers(activeIndices, comparingIndices, sortedRange);
        }

        function updateSliceNumbers(activeIndices = [], comparingIndices = [], sortedRange = null) {
            const view = displayOrder || sliceOrder;
            sliceNumbersDiv.innerHTML = '';
            for (let i = 0; i < view.length; i++) {
                const div = document.createElement('div');
                div.className = 'slice-num';
                div.textContent = view[i];

                if (activeIndices.includes(i)) div.classList.add('active');
                else if (comparingIndices.includes(i)) div.classList.add('comparing');

                if (sortedRange && i >= sortedRange[0] && i <= sortedRange[1]) {
                    div.classList.add('sorted');
                }

                sliceNumbersDiv.appendChild(div);
            }
        }

        // ================= 排序算法（生成器）=================
        // 每个生成器原地修改 order，并在**每一个可视步骤**yield 一次：
        //   { active: 位置数组, comparing: 位置数组, sortedRange: [from,to]|null, play: 切片值 }
        // 统计计数累加到 st 上。这样「预演数步数」和「播放动画」跑的是同一份代码，
        // 进度条口径不可能漂移，且每个 yield 边界上 order 都是合法排列。
        function* selectionSort(order, st) {
            const n = order.length;
            for (let i = 0; i < n - 1; i++) {
                let minIdx = i;
                for (let j = i + 1; j < n; j++) {
                    st.comparisons++;
                    const value = order[j];
                    const isSmaller = value < order[minIdx];
                    yield {
                        active: [minIdx],
                        comparing: [j],
                        sortedRange: i > 0 ? [0, i - 1] : null,
                        play: value
                    };
                    if (isSmaller) minIdx = j;
                }

                if (minIdx !== i) {
                    [order[i], order[minIdx]] = [order[minIdx], order[i]];
                    st.swaps++;
                    st.writes += 2;
                    yield {
                        active: [i, minIdx],
                        comparing: [],
                        sortedRange: [0, i],
                        play: order[i]
                    };
                } else {
                    yield {
                        active: [i],
                        comparing: [],
                        sortedRange: [0, i],
                        play: order[i]
                    };
                }
            }
        }

        // 插入排序用「相邻交换」实现：任意 yield 边界上都是合法排列，
        // 中途停止不会留下重复值，且每次比较最多一次交换，交换次数是真实交换次数。
        function* insertionSort(order, st) {
            const n = order.length;
            for (let i = 1; i < n; i++) {
                let j = i;
                let shifting = true;
                while (j > 0 && shifting) {
                    st.comparisons++;
                    if (order[j - 1] > order[j]) {
                        [order[j - 1], order[j]] = [order[j], order[j - 1]];
                        st.swaps++;
                        st.writes += 2;
                    } else {
                        shifting = false;
                    }
                    yield {
                        active: [j - 1],
                        comparing: [j],
                        sortedRange: null,
                        play: order[j - 1]
                    };
                    j--;
                }
            }
        }

        function* quickSort(order, st) {
            if (order.length > 1) {
                yield* quickRange(order, st, 0, order.length - 1);
            }
        }

        function* quickRange(order, st, low, high) {
            if (low >= high) return;

            const pivot = order[high];
            let i = low - 1;

            for (let j = low; j < high; j++) {
                st.comparisons++;
                const value = order[j];
                const isLess = value < pivot;
                if (isLess) {
                    i++;
                    [order[i], order[j]] = [order[j], order[i]];
                    st.swaps++;
                    st.writes += 2;
                }
                yield {
                    active: [i >= low ? i : low],
                    comparing: [j, high],
                    sortedRange: null,
                    play: value
                };
            }

            [order[i + 1], order[high]] = [order[high], order[i + 1]];
            st.swaps++;
            st.writes += 2;
            const pivotPos = i + 1;
            yield {
                active: [pivotPos],
                comparing: [high],
                sortedRange: null,
                play: order[pivotPos]
            };

            yield* quickRange(order, st, low, pivotPos - 1);
            yield* quickRange(order, st, pivotPos + 1, high);
        }

        function* mergeSort(order, st) {
            if (order.length > 1) {
                yield* mergeRange(order, st, 0, order.length - 1);
            }
        }

        function* mergeRange(order, st, left, right) {
            if (left >= right) return;
            const mid = (left + right) >> 1;
            yield* mergeRange(order, st, left, mid);
            yield* mergeRange(order, st, mid + 1, right);
            yield* mergeStep(order, st, left, mid, right);
        }

        function* mergeStep(order, st, left, mid, right) {
            const leftArr = order.slice(left, mid + 1);
            const rightArr = order.slice(mid + 1, right + 1);
            const merged = [];
            // 归并是「写入」而非交换。为了在任意时刻都不破坏 order 是合法排列这一前提，
            // 已确定的前缀只写进渲染覆盖层 displayOrder，整块算完后一次性原子提交。
            displayOrder = order.slice();

            try {
                let i = 0;
                let j = 0;

                while (i < leftArr.length && j < rightArr.length) {
                    st.comparisons++;
                    const takeLeft = leftArr[i] <= rightArr[j];
                    const value = takeLeft ? leftArr[i] : rightArr[j];
                    const fromPos = takeLeft ? left + i : mid + 1 + j;
                    if (takeLeft) i++; else j++;

                    merged.push(value);
                    displayOrder[left + merged.length - 1] = value;
                    st.writes++;

                    yield {
                        active: [left + merged.length - 1],
                        comparing: [fromPos],
                        sortedRange: null,
                        play: value
                    };
                }

                while (i < leftArr.length) {
                    const value = leftArr[i++];
                    merged.push(value);
                    displayOrder[left + merged.length - 1] = value;
                    st.writes++;
                    yield { active: [left + merged.length - 1], comparing: [], sortedRange: null, play: value };
                }

                while (j < rightArr.length) {
                    const value = rightArr[j++];
                    merged.push(value);
                    displayOrder[left + merged.length - 1] = value;
                    st.writes++;
                    yield { active: [left + merged.length - 1], comparing: [], sortedRange: null, play: value };
                }

                // 原子提交：这一步不 yield，因此对观察者而言顺序连续性从未被破坏
                for (let t = 0; t < merged.length; t++) {
                    order[left + t] = merged[t];
                }
            } finally {
                displayOrder = null;
            }
        }

        function* heapSort(order, st) {
            const n = order.length;

            for (let i = (n >> 1) - 1; i >= 0; i--) {
                yield* heapify(order, st, n, i, null);
            }

            for (let end = n - 1; end > 0; end--) {
                [order[0], order[end]] = [order[end], order[0]];
                st.swaps++;
                st.writes += 2;
                yield {
                    active: [0, end],
                    comparing: [],
                    sortedRange: [end, n - 1],
                    play: order[0]
                };
                yield* heapify(order, st, end, 0, [end, n - 1]);
            }
        }

        function* heapify(order, st, n, i, sortedRange) {
            let largest = i;
            const left = 2 * i + 1;
            const right = 2 * i + 2;
            const compared = [];

            if (left < n) {
                st.comparisons++;
                compared.push(left);
                if (order[left] > order[largest]) largest = left;
            }

            if (right < n) {
                st.comparisons++;
                compared.push(right);
                if (order[right] > order[largest]) largest = right;
            }

            if (compared.length > 0) {
                yield {
                    active: [i],
                    comparing: compared,
                    sortedRange: sortedRange,
                    play: order[largest]
                };
            }

            if (largest !== i) {
                [order[i], order[largest]] = [order[largest], order[i]];
                st.swaps++;
                st.writes += 2;
                yield {
                    active: [i, largest],
                    comparing: [],
                    sortedRange: sortedRange,
                    play: order[largest]
                };
                yield* heapify(order, st, n, largest, sortedRange);
            }
        }

        function makeGenerator(name, order, st) {
            switch (name) {
                case 'insertion': return insertionSort(order, st);
                case 'quick': return quickSort(order, st);
                case 'merge': return mergeSort(order, st);
                case 'heap': return heapSort(order, st);
                case 'selection':
                default: return selectionSort(order, st);
            }
        }

        // 用同一份生成器在副本上预演一次，得到精确总步数
        function countSteps(name) {
            const probe = sliceOrder.slice();
            const st = { comparisons: 0, swaps: 0, writes: 0 };
            let steps = 0;
            for (const _step of makeGenerator(name, probe, st)) {
                steps++;
            }
            return steps;
        }

        // ================= 主流程 =================
        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function formatElapsed(ms) {
            const total = ms / 1000;
            if (total < 60) return total.toFixed(1) + 's';
            const m = Math.floor(total / 60);
            const s = total - m * 60;
            return m + 'm' + s.toFixed(0).padStart(2, '0') + 's';
        }

        function startElapsedTimer() {
            stopElapsedTimer();
            elapsedTimer = setInterval(() => {
                elapsedEl.textContent = formatElapsed(performance.now() - runStartedAt);
            }, 100);
        }

        function stopElapsedTimer() {
            if (elapsedTimer !== null) {
                clearInterval(elapsedTimer);
                elapsedTimer = null;
            }
        }

        function updateStats() {
            comparisonsEl.textContent = comparisons;
            swapsEl.textContent = swaps;
            writesEl.textContent = writes;
        }

        function resetStats() {
            comparisons = 0;
            swaps = 0;
            writes = 0;
            doneSteps = 0;
            updateStats();
            elapsedEl.textContent = '0.0s';
            updateProgressUI();
        }

        // 进度 = 已完成步骤 / 预演得到的总步骤，任何算法都单调推进到 100%
        function updateProgressUI() {
            let percent = 0;
            if (totalSteps > 0) {
                percent = Math.min(100, (doneSteps / totalSteps) * 100);
            }
            progressFill.style.width = percent.toFixed(2) + '%';
        }

        function applyStep(step, st) {
            comparisons = st.comparisons;
            swaps = st.swaps;
            writes = st.writes;

            renderSlices(step.active || [], step.comparing || [], step.sortedRange || null);
            if (step.play !== undefined && step.play !== null) {
                playAudioSlice(step.play);
            }

            updateStats();
            doneSteps++;
            updateProgressUI();
        }

        function shuffleSlices() {
            if (isRunning) return;

            for (let i = sliceOrder.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [sliceOrder[i], sliceOrder[j]] = [sliceOrder[j], sliceOrder[i]];
            }

            stopAllAudio();
            displayOrder = null;
            renderSlices();
            startBtn.disabled = false;
            totalSteps = 0;
            resetStats();
            statusEl.textContent = '已打乱';
        }

        function stopSorting() {
            if (!isRunning) return;
            isStopped = true;
            stopBtn.disabled = true;
            statusEl.textContent = '正在停止...';
            stopAllAudio();
        }

        async function startSorting() {
            if (isRunning) return;
            if (sliceOrder.length < 2) return;

            isRunning = true;
            isStopped = false;
            startBtn.disabled = true;
            shuffleBtn.disabled = true;
            stopBtn.disabled = false;
            sliceSlider.disabled = true;
            algorithmSelect.disabled = true;

            stopAllAudio();
            displayOrder = null;
            resetStats();

            const algorithm = algorithmSelect.value;
            const algorithmName = algorithmSelect.options[algorithmSelect.selectedIndex].text;
            currentAlgoEl.textContent = algorithmName;
            statusEl.textContent = '排序中...';

            if (audioContext && audioContext.state === 'suspended') {
                try { await audioContext.resume(); } catch (e) { /* 忽略 */ }
            }

            totalSteps = countSteps(algorithm);
            doneSteps = 0;
            updateProgressUI();

            runStartedAt = performance.now();
            startElapsedTimer();

            const st = { comparisons: 0, swaps: 0, writes: 0 };
            const gen = makeGenerator(algorithm, sliceOrder, st);

            try {
                let step = gen.next();
                while (!step.done) {
                    applyStep(step.value, st);
                    await sleep(delay);
                    if (isStopped) {
                        gen.return();       // 让生成器的 finally 收尾（清掉归并的渲染覆盖层）
                        break;
                    }
                    step = gen.next();
                }

                stopElapsedTimer();

                if (isStopped) {
                    statusEl.textContent = '已停止';
                    renderSlices();
                } else {
                    statusEl.textContent = '排序完成！';
                    doneSteps = totalSteps;
                    updateProgressUI();
                    renderSlices([], [], [0, sliceOrder.length - 1]);
                    playFullAudio();
                }
            } catch (e) {
                console.error(e);
                statusEl.textContent = '出错';
            } finally {
                stopElapsedTimer();
                isRunning = false;
                isStopped = false;
                startBtn.disabled = false;
                shuffleBtn.disabled = false;
                stopBtn.disabled = true;
                sliceSlider.disabled = false;
                algorithmSelect.disabled = false;
            }
        }

        // 页面加载时显示提示
        window.addEventListener('DOMContentLoaded', () => {
            statusEl.textContent = '请选择资源';
            placeholder.innerHTML = '<span>🎨</span><p>请选择预设或上传图片和音频</p>';
        });
    </script>
</body>
</html>
